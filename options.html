<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Q-Hider 設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">quiet your traQ</p>
        <h1>Q-Hider</h1>
        <p>気になる表示だけを選んで隠します。初期状態ではすべて表示されます。</p>
      </header>
      <form id="settings-form">
        <section aria-labelledby="switches-heading">
          <div class="section-heading">
            <h2 id="switches-heading">非表示にする項目</h2>
            <div class="bulk-actions">
              <button id="show-all" type="button" class="secondary">すべて表示</button>
              <button id="hide-all" type="button" class="secondary">すべて非表示</button>
            </div>
          </div>
          <div class="switches">
            <div class="switch-row"><input id="hideStamps" data-q-hider-setting type="checkbox"><label for="hideStamps"><strong>メッセージのスタンプ</strong><small>リアクション一覧と余白を隠します。</small></label></div>
            <div class="switch-row"><input id="hideViewers" data-q-hider-setting type="checkbox"><label for="hideViewers"><strong>チャンネル閲覧者</strong><small>展開・折りたたみ表示の閲覧者カードを隠します。</small></label></div>
            <div class="switch-row"><input id="hideAuthorInfo" data-q-hider-setting type="checkbox"><label for="hideAuthorInfo"><strong>投稿者情報</strong><small>アイコン、表示名、ユーザー名を隠して余白を詰めます。</small></label></div>
            <div class="switch-row"><input id="hideBotMessages" data-q-hider-setting type="checkbox"><label for="hideBotMessages"><strong>Botの投稿</strong><small>Botバッジを持つメッセージ行だけを隠します。</small></label></div>
            <div class="switch-row"><input id="disableAnimations" data-q-hider-setting type="checkbox"><label for="disableAnimations"><strong>アニメーション</strong><small>動き、遷移、スムーズスクロールを最短にします。</small></label></div>
            <div class="switch-row"><input id="hideTyping" data-q-hider-setting type="checkbox"><label for="hideTyping"><strong>入力中表示</strong><small>メッセージ入力欄付近のtyping表示を隠します。</small></label></div>
            <div class="switch-row"><input id="hideLinkPreviews" data-q-hider-setting type="checkbox"><label for="hideLinkPreviews"><strong>外部リンクのプレビュー</strong><small>メッセージ内のOGPカードを隠します。</small></label></div>
            <div class="switch-row"><input id="hideAttachments" data-q-hider-setting type="checkbox"><label for="hideAttachments"><strong>添付ファイルとメディア</strong><small>画像・動画・音声・ファイル表示を隠します。</small></label></div>
          </div>
        </section>
        <section aria-labelledby="custom-heading">
          <h2 id="custom-heading">カスタムセレクター</h2>
          <label for="custom-selectors">1行につき1つのCSSセレクター</label>
          <textarea id="custom-selectors" rows="7" spellcheck="false" placeholder=".example\n[data-example]"></textarea>
          <p class="hint">各行をtraQ画面で評価し、一致した要素だけを隠します。不正な行がある場合は保存しません。</p>
        </section>
        <div class="actions">
          <button type="submit">設定を保存</button>
          <button id="reset-defaults" type="button" class="secondary">初期設定へ戻す</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="core.js"></script>
    <script src="app.js"></script>
    <script src="options.js"></script>
  </body>
</html>
